<div id="modalDetalleOrder" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Detalle de Orden #<span v-text="detalle.product_order_id"></span></h3>
  </div>
  <div class="modal-body">
    <div class="row-fluid order-resumen">
      <div class="span6">
        <p><b>Código:</b> <span v-text="detalle.serial"></span></p>
        <p><b>Cliente:</b> <span v-text="detalle.cliente"></span></p>
        <p><b>Tipo de pago:</b> <span v-text="detalle.tipo_pago"></span></p>
      </div>
      <div class="span6">
        <p><b>Total orden:</b>
          <span class="label label-success">
            S/ <span v-text="totalDetalleOrden"></span>
          </span>
        </p>
      </div>
    </div>

    <h4>Productos:</h4>
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cant.</th>
          <th>Precio</th>
          <th>Total</th>
          <th>Acc.</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="d in detallesOrder" :key="d.product_order_detail_id">
          <td v-text="d.product_name"></td>
          <td v-text="d.amount"></td>
          <td v-text="d.price_item"></td>
          <td v-text="(d.amount * d.price_item).toFixed(2)"></td>
          <td>
            <button class="btn btn-mini btn-danger" @click="eliminarDetail(d)">X</button>
          </td>
        </tr>
      </tbody>
    </table>

    <button class="btn btn-success" v-if="!ordenCerrada" @click="abrirCrearDetail">
      Nuevo prod.
    </button>
  </div>
  <div class="modal-footer">
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>
