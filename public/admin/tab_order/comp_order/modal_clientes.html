<div id="modalClientes" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Clientes</h3>
  </div>
  <div class="modal-body">
    <button class="btn btn-success" style="margin-bottom: 10px;" @click="abrirModalNuevoCliente">
      + Agregar Cliente
    </button>
    <table id="tablaClientes" class="table table-bordered table-striped" style="width: 100%;">
      <thead>
        <tr>
          <th>DNI</th>
          <th>Nombre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="modal-footer">
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>
