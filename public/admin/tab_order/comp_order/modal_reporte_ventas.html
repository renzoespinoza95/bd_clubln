<div id="modalReporteVentas" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Reporte de Ventas por Fecha</h3>
  </div>
  <div class="modal-body">
    <label>Fecha Inicio</label>
    <input type="datetime-local" v-model="reporte.fecha_inicio">

    <label>Fecha Fin</label>
    <input type="datetime-local" v-model="reporte.fecha_fin">
  </div>
  <div class="modal-footer">
    <button class="btn btn-danger" @click="reporteVentasPDF">📄 PDF</button>
    <button class="btn btn-success" @click="reporteVentasExcel">📊 Excel</button>
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>
