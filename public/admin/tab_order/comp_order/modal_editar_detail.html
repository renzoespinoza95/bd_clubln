<div id="modalEditarDetail" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Editar Ítem</h3>
  </div>
  <div class="modal-body">
    <label>Producto</label>
    <select v-model="detailForm.product_id" class="input-block-level">
      <option v-for="p in productos" :value="p.product_id" :key="p.product_id">
        {{ p.name }} - S/ {{ p.price }}
      </option>
    </select>

    <label>Cantidad</label>
    <input v-model.number="detailForm.amount" type="number" min="1">

    <label>Total</label>
    <input :value="totalItem" readonly>
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" @click="guardarDetail">Guardar</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
