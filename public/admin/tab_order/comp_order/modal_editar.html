<div id="modalEditarOrder" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Editar Orden</h3>
  </div>
  <div class="modal-body">
    <div class="control-group">
      <label>Cliente</label>
      <div class="controls">
        <input v-model="form.buyer" class="input-block-level">
      </div>
    </div>

    <div class="control-group">
      <label>Estado</label>
      <div class="controls">
        <select v-model="form.status" class="input-block-level">
          <option value="WAITING">WAITING</option>
          <option value="PAID">PAID</option>
          <option value="SENT">SENT</option>
          <option value="CANCELLED">CANCELLED</option>
        </select>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" @click="guardarOrder">Guardar</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
