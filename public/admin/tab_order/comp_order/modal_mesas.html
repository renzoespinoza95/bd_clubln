<div id="modalMesas" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Estado de Mesas</h3>
  </div>
  <div class="modal-body">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Mesa</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="m in mesas" :key="m.mesa_id">
          <td v-text="m.nombre"></td>
          <td>
            <span
              class="label"
              :class="m.estado === 'DISPONIBLE' ? 'label-success' : 'label-important'"
              v-text="m.estado">
            </span>
          </td>
          <td>
            <button
              class="btn btn-mini btn-danger"
              v-if="m.estado === 'OCUPADA'"
              @click="confirmarLiberarMesa(m)">
              Liberar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="modal-footer">
    <button class="btn" data-dismiss="modal">Cerrar</button>
  </div>
</div>
