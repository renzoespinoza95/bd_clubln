<div id="modalCrearCompra" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Nueva Compra</h3>
  </div>
  <div class="modal-body">
    <div class="control-group">
      <label>Proveedor</label>
      <div class="controls">
        <v-select
          :options="proveedores"
          label="nombre"
          v-model="nuevo.proveedor"
          placeholder="Seleccione proveedor">
        </v-select>
      </div>
    </div>

    <div class="control-group">
      <label>Fecha</label>
      <div class="controls">
        <input type="date" v-model="nuevo.fecha_compra">
      </div>
    </div>

    <h4>Items</h4>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Costo</th>
          <th>Cant.</th>
          <th>Subtotal</th>
          <th style="width: 25px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(it, i) in nuevo.items" :key="i">
          <td>{{ it.producto }}</td>
          <td>{{ it.costo_unitario }}</td>
          <td>{{ it.cantidad }}</td>
          <td>{{ (it.cantidad * it.costo_unitario).toFixed(2) }}</td>
          <td>
            <a href="#" @click.prevent="quitarItem(it)">×</a>
          </td>
        </tr>
      </tbody>
    </table>

    <button class="btn btn-small btn-success" @click="abrirModalAgregarItemCompra">
      + Agregar prod.
    </button>

    <hr>
    <h3>Total: S/ {{ totalNuevo.toFixed(2) }}</h3>
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" @click="crearCompra">Guardar</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
