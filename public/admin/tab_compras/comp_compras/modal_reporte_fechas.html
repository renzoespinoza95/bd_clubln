<div id="modalReporteFechas" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Reporte de Compras por Fecha</h3>
  </div>
  <div class="modal-body">
    <label>Fecha Inicio</label>
    <input type="date" v-model="filtro.fecha_ini">

    <label>Fecha Término</label>
    <input type="date" v-model="filtro.fecha_fin">
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" @click="imprimirReporte">Imprimir PDF</button>
    <button class="btn btn-success" @click="descargarExcel">Descargar Excel</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
