<div id="modalAgregarItemCompra" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Agregar Producto</h3>
  </div>
  <div class="modal-body">
    <label>Producto</label>
    <v-select
      :options="productosSelectCompra"
      label="label"
      v-model="itemTemp.producto"
      placeholder="Seleccione un producto">
    </v-select>

    <label style="margin-top:10px;">Costo Unitario</label>
    <input type="number" step="0.01" min="0" v-model.number="itemTemp.costo_unitario">

    <label>Cantidad</label>
    <input type="number" v-model.number="itemTemp.cantidad" min="1">

    <label>Subtotal</label>
    <input
      type="number"
      :value="(itemTemp.cantidad * itemTemp.costo_unitario).toFixed(2)"
      readonly>
  </div>
  <div class="modal-footer">
    <button class="btn btn-danger" @click="confirmarAgregarItemCompra">Aceptar</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
