<div id="modalAddItems" class="modal hide fade" tabindex="-1">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3>Agregar Productos a Compra #{{ compraAdd.compra_id }}</h3>
  </div>
  <div class="modal-body">
    <h4>Productos actuales</h4>
    <table class="table table-bordered table-condensed">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Costo</th>
          <th>Cantidad</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(p, idx) in itemsExistentes" :key="idx">
          <td>{{ p.producto }}</td>
          <td>{{ p.precio_unitario }}</td>
          <td>{{ p.cantidad }}</td>
        </tr>
      </tbody>
    </table>

    <h4 style="margin-top:15px">Agregar nuevos productos</h4>
    <table class="table table-bordered">
      <tbody>
        <tr v-for="(it, index) in compraAdd.items_nuevos" :key="index">
          <td>
            <select v-model="it.product_id" class="input-large">
              <option v-for="p in productos" :value="p.product_id" :key="p.product_id">{{ p.name }}</option>
            </select>
          </td>
          <td><input v-model.number="it.costo_unitario" class="input-mini" placeholder="Costo"></td>
          <td><input v-model.number="it.cantidad" class="input-mini" placeholder="Cant."></td>
          <td>
            <a href="#" @click.prevent="quitarItemAdd(it)">×</a>
          </td>
        </tr>
      </tbody>
    </table>

    <button class="btn btn-mini" @click="agregarItemAdd">+ Item</button>
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" @click="guardarAddItems">Guardar</button>
    <button class="btn" data-dismiss="modal">Cancelar</button>
  </div>
</div>
